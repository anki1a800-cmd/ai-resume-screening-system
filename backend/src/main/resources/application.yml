server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: ai-resume-screening-backend
  datasource:
    # Defaults to in-memory PostgreSQL-compatible H2 for instant local demo/viva,
    # or connects to PostgreSQL/MySQL when DB_URL is provided
    url: ${DB_URL:jdbc:h2:mem:resume_screening_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# Application-specific properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  storage:
    upload-dir: ${UPLOAD_DIR:./storage/resumes}
