server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: ai-resume-screening-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_screening_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# Application-specific properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  storage:
    upload-dir: ${UPLOAD_DIR:./storage/resumes}
